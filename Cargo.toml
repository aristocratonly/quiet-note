[package]
name = "quiet-note"
version = "0.7.1"
edition = "2021"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "persistence", "accesskit", "x11", "wayland"] }
egui-phosphor = { version = "0.11", features = ["regular", "fill"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.15"
trash = "5"
dirs = "5"
egui_extras = { version = "0.33", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
ureq = { version = "2", features = ["json"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
printpdf = "0.7"
ttf-parser = "0.21"
base64 = "0.22"
md5 = "0.7"
serde_json = "1"

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["wgpu", "snapshot"] }

[profile.release]
opt-level = 3
lto = true
strip = true
